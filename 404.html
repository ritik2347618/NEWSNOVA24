<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Page Not Found - NEWSNOVA24</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 20px;
        }

        .error-container {
            max-width: 600px;
        }

        .error-container h1 {
            font-size: 100px;
            color: #d71920;
            margin-bottom: 10px;
        }

        .error-container h2 {
            font-size: 30px;
            margin-bottom: 15px;
            color: #222;
        }

        .error-container p {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .home-button {
            display: inline-block;

            padding: 13px 25px;

            background: #d71920;
            color: white;

            text-decoration: none;

            border-radius: 5px;

            font-weight: bold;
        }

        .home-button:hover {
            opacity: 0.85;
        }

    </style>

</head>


<body>

    <div class="error-container">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            Sorry, the page you are looking for
            does not exist or may have been moved.
        </p>

        <a
            href="/"
            class="home-button"
        >
            Back to NEWSNOVA24
        </a>

    </div>

</body>

</html>
